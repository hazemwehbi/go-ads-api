name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ads -d ads_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ads:ads@localhost:5432/ads_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - run: test -z "$(gofmt -l ads common)"
      - name: Lint ads and common
        run: |
          docker run --rm --mount "type=bind,source=$PWD,target=/src,readonly" -w /src \
            golangci/golangci-lint:v2.15.0 golangci-lint run --config=.golangci.yml ./ads/... ./common/...
      - run: go vet ./...
      - run: go test -race -tags=integration -count=1 -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build ads API image
        run: docker build --tag ads-api:ci --file ads/internal/cmd/ads-api/Dockerfile .
